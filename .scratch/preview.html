/* ===== api-aliases.js ===== */
{
/* Explicit Custom Element names for Kotlin composables represented by shared Web components. */

class SuiAliasElement extends SuiElement {
  static targetTag = "div";
  static forcedAttributes = {};
  static fallbackAttributes = {};
  static get observedAttributes() { return ["checked", "state", "disabled", "label", "text", "size", "value", "placeholder", "width", "color", "thickness"]; }

  render() {
    const target = document.createElement(this.constructor.targetTag);
    for (const attribute of this.attributes) {
      if (attribute.name !== "style" && attribute.name !== "class") {
        target.setAttribute(attribute.name, attribute.value);
      }
    }
    for (const [name, value] of Object.entries(this.constructor.forcedAttributes)) {
      target.setAttribute(name, value);
    }
    for (const [name, source] of Object.entries(this.constructor.fallbackAttributes)) {
      if (!target.hasAttribute(name) && this.hasAttribute(source)) {
        target.setAttribute(name, this.getAttribute(source));
      }
    }
    if (this.childNodes.length > 0) {
      target.innerHTML = "<slot></slot>";
    }
    this.shadowRoot.innerHTML = "<style>:host{display:inline-flex}</style>";
    this.shadowRoot.append(target);
  }
}

{
/* DateRangePicker — the range-selection counterpart to sui-date-picker. */

const WEEKDAYS = ["S", "M", "T", "W", "T", "F", "S"];
const MONTHS = ["January", "February", "March", "April", "May", "June",
  "July", "August", "September", "October", "November", "December"];

function dateValue(year, month, day) {
  return year + "-" + String(month + 1).padStart(2, "0") + "-" + String(day).padStart(2, "0");
}

function timeValue(value) {
  if (!value) return null;
  const date = new Date(value + "T00:00:00Z");
  return Number.isNaN(date.getTime()) ? null : date.getTime();
}

class SuiDateRangePicker extends SuiElement {
  static get observedAttributes() { return ["year", "month", "start", "end", "disabled"]; }

  render() {
    const today = new Date();
    const year = Math.round(this.num("year", today.getFullYear()));
    const month = Math.min(11, Math.max(0, Math.round(this.num("month", today.getMonth()))));
    const start = this.attr("start");
    const end = this.attr("end");
    const startTime = timeValue(start);
    const endTime = timeValue(end);
    const disabled = this.bool("disabled");
    const firstDay = new Date(year, month, 1).getDay();
    const days = new Date(year, month + 1, 0).getDate();
    const cells = Array(firstDay).fill(null).concat(Array.from({ length: days }, (_, index) => index + 1));
    const classes = (day) => {
      const value = dateValue(year, month, day);
      const time = timeValue(value);
      return [value === start ? "start" : "", value === end ? "end" : "",
        startTime != null && endTime != null && time > startTime && time < endTime ? "between" : ""]
        .filter(Boolean).join(" ");
    };
    this.shadowRoot.innerHTML = [
      "<style>:host{display:inline-flex}.calendar{width:416px;padding:16px;color:", themeColor("labelPrimary"),
      ";box-sizing:border-box}.calendar.disabled{opacity:var(--sui-disable-alpha,.3);pointer-events:none}",
      ".head{height:32px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}",
      ".title{font:700 20px/26px sans-serif}.nav{width:32px;height:32px;border:0;border-radius:50%;background:transparent;",
      "color:inherit;font-size:20px;cursor:pointer}.nav:hover{background:var(--sui-lighten-hover)}",
      ".grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.wk,.day{height:32px;display:grid;place-items:center}",
      ".wk{font-size:12px;color:", themeColor("labelQuaternary"), "}.day{position:relative;border:0;background:transparent;",
      "color:inherit;font:500 14px/18px sans-serif;cursor:pointer;border-radius:16px}.day:hover{background:var(--sui-lighten-hover)}",
      ".day.between{border-radius:0;background:", themeColor("fillLight"), "}.day.start,.day.end{background:",
      themeColor("fillSecondary"), ";border-radius:16px}.empty{visibility:hidden}</style>",
      '<div class="calendar ', disabled ? "disabled" : "", '"><div class="head"><button class="nav prev">‹</button><span class="title">',
      escapeHtml(MONTHS[month] + " " + year), '</span><button class="nav next">›</button></div><div class="grid">',
      WEEKDAYS.map((weekday) => '<div class="wk">' + weekday + "</div>").join(""),
      cells.map((day) => day == null ? '<span class="empty"></span>' :
        '<button class="day ' + classes(day) + '" data-day="' + day + '">' + day + "</button>").join(""),
      "</div></div>",
    ].join("");
    this.shadowRoot.querySelector(".prev").addEventListener("click", () => this.changeMonth(year, month, -1));
    this.shadowRoot.querySelector(".next").addEventListener("click", () => this.changeMonth(year, month, 1));
    this.shadowRoot.querySelectorAll(".day").forEach((day) => day.addEventListener("click", () => {
      const value = dateValue(year, month, Number(day.dataset.day));
      const valueTime = timeValue(value);
      if (!start || end || valueTime < startTime) {
        this._rendered = false;
        this.removeAttribute("end");
        this.setAttribute("start", value);
        this.render();
        this._rendered = true;
        emit(this, "range-change", { start: value, end: null });
      } else {
        this.setAttribute("end", value);
        emit(this, "range-change", { start, end: value });
      }
    }));
  }

  changeMonth(year, month, amount) {
    const value = new Date(year, month + amount, 1);
    this.setAttribute("year", String(value.getFullYear()));
    this.setAttribute("month", String(value.getMonth()));
  }
}

define("sui-date-range-picker", SuiDateRangePicker);

/* AlertDialog, DatePickerDialog and Sheet families. */

class SuiModalSurface extends SuiElement {
  constructor() {
    super();
    this._cleanup = [];
  }

  connectedCallback() {
    super.connectedCallback();
    this.setAttribute("popover", "manual");
    this.activate();
  }

  disconnectedCallback() {
    this.deactivate();
    try { this.hidePopover?.(); } catch (_) { /* Already detached or unsupported. */ }
  }

  attributeChangedCallback(name, oldValue, newValue) {
    super.attributeChangedCallback(name, oldValue, newValue);
    if (oldValue !== newValue && this.isConnected) queueMicrotask(() => this.activate());
  }

  deactivate() { this._cleanup.splice(0).forEach((cleanup) => cleanup()); }

  activate() {
    this.deactivate();
    if (this.hidden) return;
    try {
      if (!this.matches(":popover-open")) this.showPopover?.();
    } catch (_) { /* Fixed-position fallback. */ }
    const backdrop = this.shadowRoot.querySelector(".backdrop");
    if (!backdrop) return;
    if (this.dismissOnOutside()) {
      const outside = (event) => {
        if (event.target === backdrop) this.requestDismiss("outside-pointer", event);
      };
      backdrop.addEventListener("pointerdown", outside);
      this._cleanup.push(() => backdrop.removeEventListener("pointerdown", outside));
    }
    if (this.dismissOnEscape()) {
      const escape = (event) => {
        if (event.key === "Escape" && !event.defaultPrevented) {
          event.preventDefault();
          this.requestDismiss("escape-key", event);
        }
      };
      this.ownerDocument.addEventListener("keydown", escape, true);
      this._cleanup.push(() => this.ownerDocument.removeEventListener("keydown", escape, true));
    }
    this.shadowRoot.querySelector(".panel")?.focus({ preventScroll: true });
  }

  dismissOnOutside() { return this.bool("dismiss-on-click-outside"); }
  dismissOnEscape() { return this.bool("dismiss-on-escape"); }
  requestDismiss(reason, sourceEvent) { emit(this, "dismiss-request", { reason, sourceEvent }); }

  modalCss(radius, material = "thick") {
    const background = material === "thickest"
      ? "var(--Background-MaterialThickest,#dedede)"
      : "var(--Background-MaterialThick,#dddddd)";
    return [
      ":host{position:fixed;inset:0;display:block;width:auto;height:auto;margin:0;padding:0;border:0;",
      "background:transparent;z-index:var(--sui-modal-z-index,1200);font-family:inherit}",
      ":host([hidden]){display:none!important}.backdrop{position:absolute;inset:0;display:grid;place-items:center;padding:32px;",
      "background:rgba(0,0,0,.28);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}",
      ".panel{max-width:calc(100vw - 64px);max-height:calc(100vh - 64px);overflow:auto;outline:none;color:",
      themeColor("labelPrimary"), ";background:", background, ";backdrop-filter:blur(64px) saturate(1.2);",
      "-webkit-backdrop-filter:blur(64px) saturate(1.2);border-radius:", radius,
      "px;box-shadow:0 30px 90px rgba(0,0,0,.38),inset 0 0 0 1px rgba(255,255,255,.3)}",
      "*,*::before,*::after{box-sizing:border-box}",
    ].join("");
  }
}

class SuiBasicSheet extends SuiModalSurface {
  static get observedAttributes() { return ["corner-radius", "dismiss-on-click-outside", "dismiss-on-escape", "hidden", "for", "screen-height-dp"]; }

  resolveWindow() {
    const anchorId = this.attr("for");
    const anchor = anchorId ? this.ownerDocument.getElementById(anchorId) : this;
    const window = anchor?.closest("sui-planar-window");
    if (window) return window;
    const stage = this.closest("sui-preview-stage");
    const windows = stage ? [...stage.querySelectorAll("sui-planar-window")].filter(el => !el.hidden) : [];
    return windows.length === 1 ? windows[0] : null;
  }

  connectedCallback() {
    super.connectedCallback();
    this.observeWindow();
  }

  attributeChangedCallback(name, oldValue, newValue) {
    super.attributeChangedCallback(name, oldValue, newValue);
    if (this.isConnected && (name === "for" || name === "screen-height-dp")) this.observeWindow();
  }

  observeWindow() {
    this._windowResize?.disconnect();

<script>
(function () {
  "use strict";

  const spec = JSON.parse(document.getElementById("pico-design-spec").textContent);
  const root = document.getElementById("preview-root");
  root.dataset.designSpecRevision = String(spec.metadata.revision);

  const brand = spec.theme.brandColors || {};
  const NATIVE_VARS = {
    fillPrimary: "--sui-fill-primary",
    fillSecondary: "--sui-fill-secondary",
    fillTertiary: "--sui-fill-tertiary",
    fillLight: "--sui-fill-light",
    labelPrimaryLight: "--sui-label-primary-light",
    labelPrimary: "--sui-label-primary",
    labelSecondary: "--sui-label-secondary",
    labelTertiary: "--sui-label-tertiary",
    labelQuaternary: "--sui-label-quaternary",
    lightenHover: "--sui-lighten-hover",
    lightenPressed: "--sui-lighten-pressed",
    error: "--sui-error",
    alert: "--sui-alert",
    passable: "--sui-passable",
    interaction: "--sui-interaction",
    dividerLine: "--sui-divider-line"
  };
  function brandVar(name) {
    return "--brand-" + name.replace(/[A-Z]/g, (c) => "-" + c.toLowerCase());
  }
  for (const [name, value] of Object.entries(brand)) {
    document.documentElement.style.setProperty(brandVar(name), value);
  }
  function cssToken(token) {
    if (token == null) return "currentColor";
    if (String(token).startsWith("#")) return String(token);
    if (Object.prototype.hasOwnProperty.call(brand, token)) return "var(" + brandVar(token) + ")";
    if (Object.prototype.hasOwnProperty.call(NATIVE_VARS, token)) return "var(" + NATIVE_VARS[token] + ")";
    return String(token);
  }

  const nodeById = Object.fromEntries(spec.nodes.map((node) => [node.id, node]));
  const assetById = Object.fromEntries((spec.assets || []).map((asset) => [asset.id, asset]));
  const sceneNode = nodeById.scene;
  const params = new URLSearchParams(window.location.search);
  let dataCaseName = spec.dataCases[params.get("case")] ? params.get("case") : "normal";
  function getCaseData() {
    return spec.dataCases[dataCaseName] || spec.dataCases.normal;
  }
  let currentStateId = spec.states.some((state) => state.id === params.get("state"))
    ? params.get("state")
    : spec.initialStateId;
  let selectedPlanetId = params.get("planet") || getCaseData().selectedPlanetId;
  if (!getCaseData().planets.some((planet) => planet.id === selectedPlanetId)) {
    selectedPlanetId = getCaseData().planets[0].id;
  }
  const visualById = Object.fromEntries(sceneNode.props.planets.map((planet) => [planet.id, planet]));
  const normalNameById = Object.fromEntries(
    spec.dataCases.normal.planets.map((planet) => [planet.id, planet.name])
  );

  function selectedPlanet() {
    const data = getCaseData();
    const planet = data.planets.find((item) => item.id === selectedPlanetId) || data.planets[0];
    const visual = visualById[planet.id] || {};
    return Object.assign({}, planet, { color: visual.color || "earth" });
  }
  function getPath(object, path) {
    return path.split(".").reduce((value, key) => (value == null ? undefined : value[key]), object);
  }
  function resolveBinding(path) {
    if (!path) return undefined;
    if (path === "selectedPlanet" || path.startsWith("selectedPlanet.")) {
      return getPath({ selectedPlanet: selectedPlanet() }, path);
    }
    return getPath(Object.assign({ dataCase: dataCaseName }, getCaseData()), path);
  }

  function applyLayout(el, layout) {
    if (!layout) return;
    if (layout.mode === "row" || layout.mode === "column") {
      el.style.display = "flex";
      el.style.flexDirection = layout.mode;
    } else if (layout.mode === "grid") {
      el.style.display = "grid";
      el.style.gridTemplateColumns = "repeat(" + (layout.columns || 1) + ", minmax(0, 1fr))";
    } else if (layout.mode === "stack" || layout.mode === "overlay") {
      el.style.display = "block";
      el.style.position = "relative";
    } else if (layout.mode === "scroll") {
      el.style.display = "block";
      el.style.overflow = "auto";
    }
    if (layout.gapDp != null) el.style.gap = layout.gapDp + "px";
    if (layout.paddingDp != null) {
      if (typeof layout.paddingDp === "number") {
        el.style.padding = layout.paddingDp + "px";
      } else {
        el.style.paddingTop = layout.paddingDp.top + "px";
        el.style.paddingRight = layout.paddingDp.right + "px";
        el.style.paddingBottom = layout.paddingDp.bottom + "px";
        el.style.paddingLeft = layout.paddingDp.left + "px";
      }
    }
    if (layout.widthDp != null) el.style.width = layout.widthDp + "px";
    if (layout.heightDp != null) el.style.height = layout.heightDp + "px";
    if (layout.minWidthDp != null) el.style.minWidth = layout.minWidthDp + "px";
    if (layout.minHeightDp != null) el.style.minHeight = layout.minHeightDp + "px";
    if (layout.align) {
      const alignMap = { start: "flex-start", center: "center", end: "flex-end", stretch: "stretch", baseline: "baseline" };
      el.style.alignItems = alignMap[layout.align] || layout.align;
    }
    if (layout.justify) {
      const justifyMap = { start: "flex-start", center: "center", end: "flex-end", "space-between": "space-between", "space-around": "space-around" };
      el.style.justifyContent = justifyMap[layout.justify] || layout.justify;
    }
    if (layout.overflow) {
      el.style.overflow = layout.overflow === "scroll" ? "auto" : layout.overflow;
    }
  }

  function effectiveLayout(node) {
    if (!node.layout) return null;
    let layout = Object.assign({}, node.layout);
    for (const rule of spec.responsiveRules || []) {
      if (rule.surfaceId !== "main") continue;
      if (rule.when.maxWidthDp != null && window.innerWidth <= rule.when.maxWidthDp) {
        const override = rule.overrides.find((item) => item.nodeId === node.id);
        if (override && override.layout) layout = Object.assign(layout, override.layout);
      }
    }
    return layout;
  }

  function isVisible(node) {
    return !node.visibleInStates || node.visibleInStates.includes(currentStateId);
  }

  function makeIcon(node) {
    const el = document.createElement("sui-icon");
    el.dataset.nodeId = node.id;
    const props = Object.assign({}, node.props || {});
    if (node.bindings && node.bindings.tint) {
      props.tint = resolveBinding(node.bindings.tint);
    }
    if (props.size != null) el.setAttribute("size", String(props.size));
    if (props.tint != null) el.setAttribute("tint", cssToken(props.tint));
    const asset = assetById[node.assetId];
    if (asset && ICONS[asset.src]) {
      el.innerHTML = ICONS[asset.src];
    }
    return el;
  }

  function dispatchAction(actionId) {
    if (actionId === "close-facts" || actionId === "dismiss-facts") {
      closeFacts();
    }
  }

  function renderSpatialui(node) {
    if (node.component === "sui-icon") return makeIcon(node);
    const el = document.createElement(node.component);
    el.dataset.nodeId = node.id;
    if (node.accessibilityLabel) el.setAttribute("aria-label", node.accessibilityLabel);
    for (const [key, value] of Object.entries(node.props || {})) {
      if (key === "anchor-binding") continue;
      if (typeof value === "boolean") {
        el.setAttribute(key, value ? "" : "false");
      } else if (value != null) {
        el.setAttribute(key, String(value));
      }
    }
    if (node.component === "sui-spatial-popup") {
      el.setAttribute("for", "planet-" + selectedPlanetId);
      el.hidden = true;
    }
    for (const childId of node.children || []) {
      const child = renderNode(childId, node.id);
      if (child) el.appendChild(child);
    }
    for (const [eventName, actionId] of Object.entries(node.events || {})) {
      el.addEventListener(eventName, () => dispatchAction(actionId));
    }
    return el;
  }

  function renderText(node) {
    const el = document.createElement("sui-text");
    el.dataset.nodeId = node.id;
    if (node.textRole) el.dataset.textRole = node.textRole;
    const style = node.textStyle || {};
    el.setAttribute("variant", style.typography || "inherit");
    if (style.color) el.setAttribute("color", cssToken(style.color));
    let text = node.content || "";
    if (node.bindings && node.bindings.text) {
      const bound = resolveBinding(node.bindings.text);
      if (bound != null) text = String(bound);
    }
    el.textContent = text;
    if (node.textBehavior && node.textBehavior.maxLines) {
      el.style.display = "block";
      el.style.whiteSpace = "nowrap";
      el.style.overflow = "hidden";
      el.style.textOverflow = "ellipsis";
    }
    return el;
  }

  function renderNode(id, parentId) {
    const node = nodeById[id];
    if (!node || !isVisible(node)) return null;
    let el;
    if (node.kind === "layout") {
      el = document.createElement("div");
      el.dataset.nodeId = node.id;
      applyLayout(el, effectiveLayout(node));
      if (node.id === "stage-root") {
        el.style.position = "absolute";
        el.style.inset = "0";
      }
      if (parentId === "stage-root" && node.id === "hint-layer") {
        el.style.position = "absolute";
        el.style.top = "0";
        el.style.left = "0";
      }
      for (const childId of node.children || []) {
        const child = renderNode(childId, node.id);
        if (child) el.appendChild(child);
      }
    } else if (node.kind === "domain_visual") {
      el = renderDomainVisual(node);
    } else if (node.kind === "spatialui") {
      el = renderSpatialui(node);
    } else if (node.kind === "text") {
      el = renderText(node);
    } else {
      el = document.createElement("div");
      el.dataset.nodeId = node.id;
    }
    return el;
  }

  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), 1 | t);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function renderDomainVisual(node) {
    if (node.rendererKey === "orrery-scene") return renderOrreryScene(node);
    const el = document.createElement("div");
    el.dataset.nodeId = node.id;
    return el;
  }

  function renderOrreryScene(node) {
    const props = node.props;
    const scene = document.createElement("div");
    scene.className = "orrery-scene";
    scene.dataset.nodeId = node.id;
    scene.setAttribute("role", "application");
    scene.setAttribute("aria-label", node.accessibilityLabel || "Interactive solar system");

    const bg = document.createElement("div");
    bg.className = "orrery-bg";
    bg.dataset.designPartNode = node.id;
    bg.dataset.designPart = "space";
    bg.style.setProperty("--pico-design-part-fill", cssToken(node.parts.space.appearance.fill));
    const nebula = document.createElement("div");
    nebula.className = "orrery-nebula";
    nebula.dataset.designPartNode = node.id;
    nebula.dataset.designPart = "nebula";
    nebula.style.setProperty("--pico-design-part-fill", cssToken(node.parts.nebula.appearance.fill));
    nebula.style.setProperty("--nebula-opacity", String(node.parts.nebula.appearance.opacity == null ? 0.9 : node.parts.nebula.appearance.opacity));
    bg.appendChild(nebula);
    scene.appendChild(bg);

    const stars = document.createElement("div");
    stars.className = "orrery-stars";
    const starFill = cssToken(node.parts.star.appearance.fill);
    const starOpacity = node.parts.star.appearance.opacity == null ? 0.8 : node.parts.star.appearance.opacity;
    const starCount = props.background.starCount || 80;
    const rand = mulberry32(props.background.starSeed || 42);
    for (let i = 0; i < starCount; i += 1) {
      const star = document.createElement("span");
      star.className = "orrery-star";
      star.dataset.designPartNode = node.id;
      star.dataset.designPart = "star";
      star.style.setProperty("--pico-design-part-fill", starFill);
      star.style.left = (rand() * 100).toFixed(2) + "%";
      star.style.top = (rand() * 100).toFixed(2) + "%";
      const size = 1 + rand() * 2;
      star.style.width = size.toFixed(1) + "px";
      star.style.height = size.toFixed(1) + "px";
      star.style.opacity = String(starOpacity * (0.55 + rand() * 0.45));
      stars.appendChild(star);
    }
    scene.appendChild(stars);

    const world = document.createElement("div");
    world.className = "orrery-world";
    const fit = Math.min(1, (window.innerWidth - 64) / 760, (window.innerHeight - 64) / 760);
    world.style.setProperty("--fit-scale", String(Math.max(0.42, fit)));

    const orbitFill = cssToken(node.parts.orbit.appearance.fill);
    const orbitOpacity = node.parts.orbit.appearance.opacity == null ? 1 : node.parts.orbit.appearance.opacity;
    for (const planet of props.planets) {
      const ring = document.createElement("div");
      ring.className = "orrery-orbit";
      ring.dataset.designPartNode = node.id;
      ring.dataset.designPart = "orbit";
      ring.style.setProperty("--pico-design-part-fill", orbitFill);
      ring.style.opacity = String(orbitOpacity);
      const diameter = planet.orbitRadius * 2;
      ring.style.width = diameter + "px";
      ring.style.height = diameter + "px";
      world.appendChild(ring);
    }

    const sun = document.createElement("div");
    sun.className = "orrery-sun";
    sun.dataset.designPartNode = node.id;
    sun.dataset.designPart = "sun";
    sun.style.setProperty("--pico-design-part-fill", cssToken(node.parts.sun.appearance.fill));
    sun.style.setProperty("--sun-glow", cssToken(node.parts.sun.states.glow.fill));
    const sunDiameter = props.sun.radius * 2;
    sun.style.width = sunDiameter + "px";
    sun.style.height = sunDiameter + "px";
    world.appendChild(sun);

    for (const planet of props.planets) {
      const arm = document.createElement("div");
      arm.className = "orbit-arm";
      arm.style.animationDuration = planet.orbitDuration + "s";
      arm.style.animationDelay = (-(planet.startAngle / 360) * planet.orbitDuration) + "s";

      const body = document.createElement("div");
      body.className = "orrery-planet";
      body.id = "planet-" + planet.id;
      body.dataset.planetId = planet.id;
      body.dataset.designPartNode = node.id;
      body.dataset.designPart = "planetBody";
      body.style.setProperty("--orbit-radius", planet.orbitRadius + "px");
      body.style.width = planet.size + "px";
      body.style.height = planet.size + "px";
      body.setAttribute("role", "button");
      body.tabIndex = 0;
      body.setAttribute("aria-label", "Focus " + (normalNameById[planet.id] || planet.id));
      const isSelected = currentStateId === "planet-focus" && planet.id === selectedPlanetId;
      if (isSelected) {
        body.classList.add("is-selected");
        body.style.setProperty(
          "--pico-design-part-fill",
          cssToken(node.parts.planetBody.states.selected.fill)
        );
      } else {
        body.style.setProperty("--pico-design-part-fill", cssToken(planet.color));
        if (currentStateId === "planet-focus") body.classList.add("is-dimmed");
      }
      body.addEventListener("click", (event) => {
        event.stopPropagation();
        selectPlanet(planet.id);
      });
      body.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          event.stopPropagation();
          selectPlanet(planet.id);
        }
      });
      arm.appendChild(body);
      world.appendChild(arm);
    }

    if (currentStateId === "planet-focus") {
      const selectedVisual = props.planets.find((planet) => planet.id === selectedPlanetId) || props.planets[0];
      const angle = (selectedVisual.startAngle * Math.PI) / 180;
      const planetX = Math.cos(angle) * selectedVisual.orbitRadius;
      const planetY = Math.sin(angle) * selectedVisual.orbitRadius;
      const focusScale = Math.max(0.42, fit) * (props.focusScale || 1.55);
      world.style.setProperty("--focus-scale", String(focusScale));
      world.style.setProperty("--focus-tx", (-planetX * focusScale) + "px");
      world.style.setProperty("--focus-ty", (-planetY * focusScale) + "px");
      scene.classList.add("is-frozen", "is-focused");
    }

    scene.appendChild(world);

    scene.addEventListener("click", (event) => {
      if (currentStateId === "planet-focus" && !event.target.closest(".orrery-planet")) {
        closeFacts();
      }
    });

    return scene;
  }

  let renderToken = 0;
  function render() {
    const token = ++renderToken;
    root.innerHTML = "";
    const stage = document.createElement("div");
    stage.className = "stage";
    stage.dataset.state = currentStateId;
    stage.dataset.dataCase = dataCaseName;
    const state = spec.states.find((item) => item.id === currentStateId) || spec.states[0];
    const surface = spec.surfaces.find((item) => item.id === "main") || spec.surfaces[0];
    const rootId = state.surfaceRoots[surface.id] || surface.rootNodeId;
    const el = renderNode(rootId, null);
    if (el) stage.appendChild(el);
    root.appendChild(stage);

    if (currentStateId === "planet-focus") {
      const popup = stage.querySelector('[data-node-id="fact-popup"]');
      if (popup) {
        const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        window.setTimeout(() => {
          if (token !== renderToken || !popup.isConnected) return;
          popup.hidden = false;
          if (typeof popup.refreshPosition === "function") popup.refreshPosition();
          requestAnimationFrame(() => {
            if (popup.isConnected && !popup.hidden && typeof popup.refreshPosition === "function") popup.refreshPosition();
          });
          window.setTimeout(() => {
            if (token === renderToken && popup.isConnected && !popup.hidden && typeof popup.refreshPosition === "function") popup.refreshPosition();
          }, 220);
        }, reduced ? 0 : 120);
      }
    }
  }

  function selectPlanet(planetId) {
    if (!getCaseData().planets.some((planet) => planet.id === planetId)) return;
    selectedPlanetId = planetId;
    currentStateId = "planet-focus";
    render();
  }
  function closeFacts() {
    currentStateId = "overview";
    render();
  }
  function setDataCase(name) {
    if (!spec.dataCases[name]) return;
    dataCaseName = name;
    const data = getCaseData();
    if (!data.planets.some((planet) => planet.id === selectedPlanetId)) {
      selectedPlanetId = data.selectedPlanetId || data.planets[0].id;
    }
    render();
  }

  let resizeTimer = 0;
  window.addEventListener("resize", () => {
    window.clearTimeout(resizeTimer);
    resizeTimer = window.setTimeout(render, 160);
  });

  window.__preview = {
    selectPlanet,
    closeFacts,
    setDataCase,
    getState: () => ({ state: currentStateId, planet: selectedPlanetId, dataCase: dataCaseName })
  };

  render();
})();
</script>
</body>
</html>
